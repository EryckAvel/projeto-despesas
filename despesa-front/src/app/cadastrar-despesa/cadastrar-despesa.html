<div class="h-full flex justify-center items-center">
    <hlm-card class="w-95 rounded-2xl px-4 py-6 bg-[#1A1A1A]">
        <hlm-card-header>
            <h1 class="text-center text-2xl text-white font-semibold">Nova Despesa</h1>
            <p class="text-center text-sm text-[#71717A]">Preencha os campos abaixo</p>
        </hlm-card-header>  
        <div hlmCardContent class="mt-2">
            <form #formDespesa="ngForm" (ngSubmit)="salvar()" class="flex flex-col gap-2">
                <div class="flex flex-col gap-2 mt-3">
                    <label hlmLabel for="descricao" class="text-[#71717A] text-sm">Descrição</label>
                    <input hlmInput
                        id="descricao"
                        type="text"
                        name="descricao"
                        #nome="ngModel"
                        required
                        [(ngModel)]="despesa().descricao"
                        placeholder="Insira uma descrição"
                        class="text-white border-[#2A2A2A] bg-[#0D0D0D]"
                    >
                </div>
                <div class="flex flex-col gap-2 mt-3">
                    <label hlmLabel for="valor" class="text-[#71717A] text-sm">Valor</label>
                    <input hlmInput
                        id="valor"
                        type="text"
                        name="valor"
                        inputmode="decimal"
                        min="0.01" step="0.01" 
                        #valor="ngModel"
                        required
                        [(ngModel)]="despesa().valor"
                        placeholder="R$ 0,00"
                        class="text-white border-[#2A2A2A] bg-[#0D0D0D]"
                    >
                </div>
                <div class="flex flex-col gap-2 mt-3">
                    <label hlmLabel for="data" class="text-[#71717A] text-sm">Data</label>
                    <input hlmInput
                        id="data"
                        type="date"
                        name="data"
                        #data="ngModel"
                        required
                        [(ngModel)]="despesa().data"
                        class="text-white invalid:text-[#71717A] border-[#2A2A2A] bg-[#0D0D0D]"
                    >
                </div>
                <div class="flex flex-col gap-2 mt-3">
                    <label hlmLabel for="Categoria" class="text-[#71717A] text-sm">Categoria</label>
                    <hlm-select name="categoria" required [(ngModel)]="despesa().categoria">
                        <hlm-select-trigger class="w-full text-white border-[#2A2A2A] bg-[#0D0D0D]">
                            <hlm-select-value placeholder="Selecione uma categoria"/>
                        </hlm-select-trigger>
                        <hlm-select-content *hlmSelectPortal>
                            <hlm-select-group>
                                <hlm-select-label>Selecione uma categoria</hlm-select-label>
                                @for (categoria of categorias; track categoria) {
                                    <hlm-select-item [value]="categoria">{{categoria}}</hlm-select-item>
                                }
                            </hlm-select-group>
                        </hlm-select-content>
                    </hlm-select>
                </div>
                <button hlmBtn type="submit" size="lg" class="w-full bg-white text-[#0D0D0D] hover:bg-[#E4E4E7] my-3">Cadastrar</button>
            </form>
        </div>
    </hlm-card>
</div>
