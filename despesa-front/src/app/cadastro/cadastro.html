<div class="min-h-screen bg-[#0D0D0D] flex items-center justify-center">
    <hlm-card class="w-full max-w-90 rounded-2xl px-4 py-6 bg-[#1A1A1A]">
        <hlm-card-header>
            <h1 class="text-center text-2xl text-white font-semibold">Criar Conta</h1>
            <p class="text-center text-sm text-[#71717A]">Preencha os dados abaixo</p>
        </hlm-card-header>
        <div hlmCardContent class="mt-2">
        <form #formCadastro="ngForm" (ngSubmit)="cadastrar(formCadastro)" class="flex flex-col gap-4">
            <div class="flex flex-col gap-2">
                <label hlmLabel for="nome" class="text-[#71717A] text-sm">Nome</label>
                <input hlmInput
                    id="nome"
                    type="text"
                    name="nome"
                    #nome="ngModel"
                    required
                    [(ngModel)]="cadastro.nome"
                    placeholder="Insira seu nome"
                    class="text-white border-[#2A2A2A] bg-[#0D0D0D]"
                >
            </div>
            <div class="flex flex-col gap-2">
                <label hlmLabel for="email" class="text-[#71717A] text-sm">Email</label>
                <input hlmInput
                    id="email"
                    type="text"
                    name="email"
                    #nome="ngModel"
                    required
                    [(ngModel)]="cadastro.email"
                    placeholder="Insira seu Email"
                    class="text-white border-[#2A2A2A] bg-[#0D0D0D]"
                >
            </div>
            <div class="flex flex-col gap-2">
                <label hlmLabel for="senha" class="text-[#71717A] text-sm">Senha</label>
                <input hlmInput
                    id="senha"
                    type="text"
                    name="senha"
                    #nome="ngModel"
                    required
                    [(ngModel)]="cadastro.senha"
                    placeholder="Insira uma Senha"
                    class="text-white border-[#2A2A2A] bg-[#0D0D0D]"
                >
            </div>
            <button hlmBtn type="submit" size="lg" class="w-full bg-white text-[#0D0D0D] hover:bg-[#E4E4E7]">Cadastrar</button>
            <p class="text-center text-[#71717A] text-sm font-semibold">
                Já tem conta?
                <a href="/login" class="font-semibold text-[#FFFFFF] hover:text-gray-400 transition-colors">
                    Entrar
                </a>
            </p>
        </form>
    </div>
    </hlm-card>
</div>
