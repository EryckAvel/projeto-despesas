spring:
  application:
    name: despesas
  banner:
    charset: UTF-8
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    url: jdbc:h2:file:./data/despesas
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: ${JWT_SECRET:xtqSCYLcWeXI72+nyrsOprTflg2TvY5weM2SyZEVyXc=}
  expiration: ${JWT_EXPIRATION:30m}

logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID}){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-35.35logger{35}){cyan} %clr(:){faint} %m%n%wEx"
