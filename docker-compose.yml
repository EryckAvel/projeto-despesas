services:

  api:
    build: ./despesas-api
    container_name: api
    expose:
      - 8080
    ports:
      - "8080:8080"  
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    restart: unless-stopped

  front:
    build: ./despesa-front
    container_name: front
    ports:
      - 80:80
    depends_on:
      - api
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: tunnel
    command: tunnel --no-autoupdate --url http://front:80
    depends_on:
      - front
    restart: unless-stopped
